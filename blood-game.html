<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blood cell game</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efeb;--ink:#2b2226;--dim:#6e5f63;--line:#e6d6d0;--card:#fffdfc;--coral:#a8484c;--teal:#5b3a8f;--lilac:#c7b8ea;--mint:#bfe3d8;--display:"Bricolage Grotesque",system-ui,sans-serif;--sans:"Karla",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--sans);overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px 6px}
h1{font:700 1.3rem var(--display);letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:.5em}
h1::before{content:"";width:.85em;height:.85em;border-radius:50%;background:radial-gradient(circle,#7d3338 0 28%,#b5524f 32% 100%);box-shadow:0 1px 3px #7d333855}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tabs{padding:4px 16px 10px;flex-wrap:nowrap;overflow-x:auto}
button{font:500 .95rem var(--sans);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;white-space:nowrap;min-height:40px}
button:hover{background:#f6ece8}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button.go{background:var(--coral);color:#fff;border-color:var(--coral);font-weight:700}
button.go:hover{background:#8f3a3f}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
#stage{position:relative;flex:1;min-height:0;margin:0 16px 16px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--card);box-shadow:0 6px 24px #7d33381a}
canvas{width:100%;height:100%;display:block;touch-action:manipulation}
#hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);background:#fffdfcee;border:1px solid var(--line);box-shadow:0 2px 8px #7d33381a;border-radius:999px;padding:6px 16px;font-weight:700;text-align:center;pointer-events:none}
#hud:empty{display:none}
#toast{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 16px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#card{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 20px 20px;transform:translateY(105%);transition:transform .25s;box-shadow:0 -8px 28px #7d33382b}
#card.open{transform:none}
#card h2{font:700 1.5rem var(--display);letter-spacing:-.02em;margin:0}
#card small{color:var(--teal);font-weight:700;display:block;margin-bottom:8px}
#card p{margin:0 0 12px;color:var(--dim)}
#card .note{font-size:.8rem}
@media(prefers-reduced-motion:reduce){#card,#toast{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Blood cell game</h1>
  <div class="row" id="modes"><button data-m="learn" class="on">Learn</button><button data-m="play">Challenge</button></div>
</header>
<div class="tabs row" id="cats">
  <button data-c="normal" class="on">Normal blood</button>
  <button data-c="human">Human disorders</button>
  <button data-c="animal">Animal blood</button>
</div>
<div id="stage"><canvas id="cv"></canvas><div id="hud"></div><div id="toast"></div><div id="card"></div></div>

<script>
// When you finish a drawing, save it as cells/<id>.png and add its id here, e.g. ['rbc','wbc'].
// Until then the game shows a simple placeholder shape. Drawing sizes: see the cell guide sheet.
const DRAWN = ['rbc','wbc','plt','sickle','target','sphero','schisto','camel','bird','heinz','babesia'];

const E = (c, x, y, rx, ry, f, a = 0) => { c.beginPath(); c.ellipse(x, y, rx, ry, a, 0, 7); c.fillStyle = f; c.fill(); };
const RED = '#e57790', DRK = '#c4476a', PUR = '#9b86d4';

// box = width and height of the drawing, in units of the cell radius (the PNG is stretched to this box)
const CELLS = [
 {id:'rbc',cat:'normal',n:'Red blood cell',en:'Erythrocyte',r:20,box:[2,2],
  t:'Carries oxygen using hemoglobin. A biconcave disc (thinner in the middle), and in mammals it has no nucleus.',
  d:(c,r)=>{E(c,0,0,r,r,RED);E(c,0,0,r*.5,r*.5,DRK)}},
 {id:'wbc',cat:'normal',n:'White blood cell',en:'Leukocyte',r:28,box:[2,2],
  t:'An immune cell, larger than a red cell, with a nucleus. It defends the body against infection.',
  d:(c,r)=>{E(c,0,0,r,r,'#f3eef9');E(c,-r*.15,0,r*.55,r*.45,PUR);E(c,r*.35,r*.1,r*.3,r*.3,PUR)}},
 {id:'plt',cat:'normal',n:'Platelet',en:'Thrombocyte',r:11,box:[2,1.4],
  t:'A small cell fragment, broken off a large cell called a megakaryocyte. Platelets help the blood to clot.',
  d:(c,r)=>{E(c,0,0,r,r*.7,'#c7b8ea');E(c,r*.2,0,r*.3,r*.2,PUR)}},
 {id:'sickle',cat:'human',n:'Sickle cell',en:'Drepanocyte',r:24,box:[2.4,1.2],
  t:'Twisted into a crescent by abnormal hemoglobin (HbS). It can get stuck in small vessels.',
  d:(c,r)=>{c.beginPath();c.moveTo(-r*1.2,0);c.quadraticCurveTo(0,-r*1.2,r*1.2,0);c.quadraticCurveTo(0,-r*.4,-r*1.2,0);c.fillStyle=DRK;c.fill()}},
 {id:'target',cat:'human',n:'Target cell',en:'Codocyte',r:20,box:[2,2],
  t:'A dark center surrounded by a pale ring. Seen in thalassemia and some liver diseases.',
  d:(c,r)=>{E(c,0,0,r,r,RED);E(c,0,0,r*.62,r*.62,'#f6cdbf');E(c,0,0,r*.3,r*.3,DRK)}},
 {id:'sphero',cat:'human',n:'Spherocyte',en:'Spherical red cell',r:15,box:[2,2],
  t:'Small and dense, with no pale area in the middle. Seen in hemolytic anemias.',
  d:(c,r)=>{E(c,0,0,r,r,'#b3405c')}},
 {id:'schisto',cat:'human',n:'Schistocyte',en:'Fragmented red cell',r:17,box:[1.8,1.6],
  t:'Broken pieces of red cells. They appear when cells are torn while passing through damaged small vessels.',
  d:(c,r)=>{c.beginPath();[[-.9,-.3],[-.2,-.9],[.8,-.4],[.5,.2],[.9,.7],[-.4,.5]].forEach(([a,b],i)=>i?c.lineTo(a*r,b*r):c.moveTo(a*r,b*r));c.closePath();c.fillStyle=RED;c.fill()}},
 {id:'camel',cat:'animal',n:'Camelid red cell',en:'Camel and llama',r:21,box:[2.5,1.4],
  t:'In camels and llamas, red cells are oval and have no nucleus.',
  d:(c,r)=>{E(c,0,0,r*1.25,r*.7,RED);E(c,0,0,r*.6,r*.3,DRK)}},
 {id:'bird',cat:'animal',n:'Bird red cell',en:'Avian erythrocyte',r:21,box:[2.3,1.6],
  t:'In birds, red cells are oval and have a nucleus.',
  d:(c,r)=>{E(c,0,0,r*1.15,r*.8,'#ee8aa0');E(c,0,0,r*.45,r*.4,'#7b5aa8')}},
 {id:'heinz',cat:'animal',n:'Heinz bodies',en:'Oxidized hemoglobin',r:20,box:[2,2],
  t:'Clumps of hemoglobin damaged by oxidation. They look like dots at the edge of the cell and are common in cats.',
  d:(c,r)=>{E(c,0,0,r,r,RED);E(c,r*.75,-r*.3,r*.22,r*.22,'#5b2a3a');E(c,-r*.6,r*.5,r*.18,r*.18,'#5b2a3a')}},
 {id:'babesia',cat:'animal',n:'Babesia parasite',en:'Inside red cells',r:21,box:[2,2],
  t:'A parasite that lives inside red blood cells and causes hemolytic anemia, especially in dogs.',
  d:(c,r)=>{E(c,0,0,r,r,RED);E(c,-r*.3,-r*.1,r*.28,r*.16,'#3f8f89',.6);E(c,r*.25,r*.2,r*.28,r*.16,'#3f8f89',-.6)}}
];
const imgs = {};
DRAWN.forEach(k => { const i = new Image(); i.src = 'cells/' + k + '.png'; imgs[k] = i; });

const cv = document.getElementById('cv'), x = cv.getContext('2d');
const card = document.getElementById('card'), hud = document.getElementById('hud'), toast = document.getElementById('toast');
let W, H, cells = [], cat = 'normal', mode = 'learn', frozen = false, sel = null;
let score = 0, time = 45, target = null, running = false, last = 0;

function resize() {
  const d = devicePixelRatio || 1;
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', resize);
new ResizeObserver(resize).observe(cv);

const top_ = () => H * .14, bot_ = () => H * .66;
const pool = () => { const p = CELLS.filter(c => c.cat === cat); return cat === 'normal' ? p : p.concat(p, [CELLS[0], CELLS[0], CELLS[0]]); };

function spawn(initial) {
  const t = pool()[Math.random() * pool().length | 0];
  const r = t.r * (.9 + Math.random() * .25);
  const a = top_() + r + 6, b = bot_() - r - 6;
  const y = a + Math.random() * (b - a);
  const lane = (y - (a + b) / 2) / ((b - a) / 2);
  cells.push({ t, r, y, x: initial ? Math.random() * W : -r * 2, vx: (45 + Math.random() * 25) * (1.2 - lane * lane * .8), a: Math.random() * 6.28, va: (Math.random() - .5) * 1.2 });
}
function fill() { cells = []; for (let i = 0; i < 16; i++) spawn(true); }

let flow = 0;
function drawVessel() {
  const t = top_(), b = bot_(), wall = 26;
  let g;
  // tissue outside the vessel
  x.fillStyle = '#f6efeb'; x.fillRect(0, 0, W, H);
  // vessel wall (top and bottom), darker toward the lumen
  g = x.createLinearGradient(0, t - wall, 0, t); g.addColorStop(0, '#eccfc5'); g.addColorStop(1, '#cf8f85');
  x.fillStyle = g; x.fillRect(0, t - wall, W, wall);
  g = x.createLinearGradient(0, b, 0, b + wall); g.addColorStop(0, '#cf8f85'); g.addColorStop(1, '#eccfc5');
  x.fillStyle = g; x.fillRect(0, b, W, wall);
  // endothelial cells in the wall: faint borders and flat nuclei
  x.strokeStyle = 'rgba(125,51,56,.14)'; x.lineWidth = 1; x.beginPath();
  for (let i = 0; i < W + 90; i += 90) { x.moveTo(i, t - wall); x.lineTo(i - 8, t); x.moveTo(i + 45, b); x.lineTo(i + 37, b + wall); }
  x.stroke();
  x.fillStyle = 'rgba(110,60,110,.16)';
  for (let i = 40; i < W + 90; i += 90) { x.beginPath(); x.ellipse(i, t - wall / 2 - 2, 15, 4, 0, 0, 7); x.fill(); x.beginPath(); x.ellipse(i + 45, b + wall / 2 + 2, 15, 4, 0, 0, 7); x.fill(); }
  // plasma: warm, slightly darker near the walls for depth
  g = x.createLinearGradient(0, t, 0, b);
  g.addColorStop(0, '#e9b9ad'); g.addColorStop(.16, '#f6dcd3'); g.addColorStop(.5, '#fdeee8'); g.addColorStop(.84, '#f6dcd3'); g.addColorStop(1, '#e9b9ad');
  x.fillStyle = g; x.fillRect(0, t, W, b - t);
  // soft flow streaks
  x.strokeStyle = 'rgba(255,255,255,.45)'; x.lineWidth = 2; x.lineCap = 'round';
  for (let i = 0; i < 7; i++) {
    const y = t + (b - t) * (i + .7) / 7.4, len = 70 + (i * 37) % 60, sp = 18 + (i % 3) * 9;
    const px = ((flow * sp / 30 + i * 223) % (W + 300)) - 150;
    x.beginPath(); x.moveTo(px, y); x.lineTo(px + len, y); x.stroke();
  }
  // thin lining on the lumen edge
  x.fillStyle = '#b86a68'; x.fillRect(0, t - 3, W, 3); x.fillRect(0, b, W, 3);
}

function frame(ts) {
  const dt = Math.min((ts - last) / 1000, .05); last = ts;
  const sp = frozen ? .06 : 1;
  flow += dt * sp * 30;
  x.clearRect(0, 0, W, H);
  drawVessel();
  for (let i = cells.length - 1; i >= 0; i--) {
    const c = cells[i];
    c.x += c.vx * dt * sp; c.a += c.va * dt * sp;
    if (c.x > W + c.r * 2) { cells.splice(i, 1); spawn(false); continue; }
  }
  const d = devicePixelRatio || 1;
  for (const c of cells) {
    if (c === sel) {
      x.beginPath(); x.arc(c.x, c.y, c.r * 1.45, 0, 7);
      x.fillStyle = 'rgba(168,72,76,.12)'; x.fill();
      x.strokeStyle = '#a8484c'; x.lineWidth = 2.5; x.stroke();
    }
    x.save();
    x.shadowColor = 'rgba(110,35,45,.28)'; x.shadowBlur = 8 * d; x.shadowOffsetY = 3 * d;
    x.translate(c.x, c.y); x.rotate(c.a);
    const im = imgs[c.t.id], b = c.t.box;
    if (im && im.complete && im.naturalWidth) x.drawImage(im, -c.r * b[0] / 2, -c.r * b[1] / 2, c.r * b[0], c.r * b[1]); else c.t.d(x, c.r);
    x.restore();
  }
  if (running) {
    time -= dt;
    if (time <= 0) endGame(); else hud.textContent = `Catch: ${target.n}  ·  Score ${score}  ·  ${Math.ceil(time)}s`;
  }
  requestAnimationFrame(frame);
}

function say(s) { toast.textContent = s; toast.classList.add('show'); clearTimeout(say.t); say.t = setTimeout(() => toast.classList.remove('show'), 1600); }
function closeCard() { card.classList.remove('open'); frozen = false; sel = null; }
function showCard(html) { card.innerHTML = html; card.classList.add('open'); }

function newTarget() {
  const p = CELLS.filter(c => c.cat === cat);
  let t; do { t = p[Math.random() * p.length | 0]; } while (p.length > 1 && t === target);
  target = t;
}
function startGame() { closeCard(); score = 0; time = 45; running = true; newTarget(); fill(); }
function endGame() {
  running = false; hud.textContent = ''; frozen = true;
  showCard(`<h2>Time's up! Score: ${score}</h2><p>Try another category, or play again.</p><button class="go" id="again">Play again</button>`);
  document.getElementById('again').onclick = () => { frozen = false; startGame(); };
}

cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  let best = null, bd = 1e9;
  for (const c of cells) { const d = Math.hypot(c.x - px, c.y - py); if (d < c.r * 1.4 && d < bd) { best = c; bd = d; } }
  if (!best) { if (mode === 'learn') closeCard(); return; }
  if (mode === 'learn') {
    sel = best; frozen = true;
    showCard(`<h2>${best.t.n}</h2><small>${best.t.en}</small><p>${best.t.t}</p><p class="note">.</p><button class="go" id="x">Continue</button>`);
    document.getElementById('x').onclick = closeCard;
  } else if (running) {
    if (best.t === target) { score++; say('Correct!'); cells.splice(cells.indexOf(best), 1); spawn(false); newTarget(); }
    else say(`That is a ${best.t.n.toLowerCase()}`);
  }
});

function setMode(m) {
  mode = m; running = false; closeCard(); hud.textContent = '';
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  fill();
  if (m === 'play') startGame(); else hud.textContent = 'Tap any cell to learn about it';
}
document.getElementById('modes').onclick = e => { if (e.target.dataset.m) setMode(e.target.dataset.m); };
document.getElementById('cats').onclick = e => {
  if (!e.target.dataset.c) return;
  cat = e.target.dataset.c;
  document.querySelectorAll('#cats button').forEach(b => b.classList.toggle('on', b.dataset.c === cat));
  setMode(mode);
};

resize(); setMode('learn'); requestAnimationFrame(t => { last = t; frame(t); });
</script>
</body>
</html>
