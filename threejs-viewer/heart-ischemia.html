<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ischemia: journey (v4 - cinematic)</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:#05080a;color:#e8f0f2;font:500 1rem system-ui,sans-serif}
#app{height:100%;display:flex}
#left{position:relative;flex:1;min-width:0;display:grid;place-items:center}
#stage{position:relative;background:#000;border-radius:14px;overflow:hidden;touch-action:none;box-shadow:0 0 90px #ff4d6d2e}
#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#poly{fill:rgba(255,77,109,.35);stroke:#ff4d6d;stroke-width:3;vector-effect:non-scaling-stroke;display:none}
#poly.pulse{display:block;animation:glow 1.1s ease-in-out infinite}
#poly.good{display:block;fill:rgba(57,255,136,.3);stroke:#39ff88}
#dead{fill:rgba(15,15,18,.92);display:none}
@keyframes glow{50%{fill-opacity:.1}}
#cap{position:absolute;left:0;right:0;bottom:0;padding:56px 22px 20px;background:linear-gradient(transparent,#000e);text-align:center;line-height:1.5;transition:opacity .3s;pointer-events:none}
#track{position:absolute;left:18px;right:18px;top:16px;height:3px;background:#ffffff26;border-radius:3px}
#tf{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff4d6d,#ffc2cd);box-shadow:0 0 10px #ff4d6d;border-radius:3px}
#hint{position:absolute;left:0;right:0;top:30px;text-align:center;font-size:.85rem;letter-spacing:.08em;color:#ffffffb0;display:none;pointer-events:none;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(12px)}}
#card{position:absolute;left:12px;right:12px;bottom:12px;background:#0a1114f2;border:1px solid #ff4d6d66;border-radius:16px;padding:16px 18px;display:none;z-index:5}
#card h2{font-size:1.05rem;color:#ff8da1;margin-bottom:6px;letter-spacing:.04em}
#card p{font-size:.95rem;line-height:1.5;margin-bottom:8px}
#card .ok{color:#39ff88}#card .bad{color:#ff8da1}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.b{font:600 .92rem system-ui,sans-serif;background:#ff4d6d;color:#fff;border:0;border-radius:999px;padding:9px 18px;cursor:pointer;text-align:left}
.b.alt{background:#ffffff14;border:1px solid #ffffff33}
.b:disabled{opacity:.35;cursor:default}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#05080a;z-index:9}
#mon{display:none;width:min(520px,46vw);padding:18px;flex-direction:column;gap:10px;border-left:1px solid #16252b;background:#070c0f;overflow:auto}
.mh{display:flex;justify-content:space-between;color:#7fa;font-size:.9rem;letter-spacing:.08em}
#ecg{width:100%;height:150px;background:#030607;border:1px solid #16252b;border-radius:10px}
.vit{display:flex;gap:10px}.vit div{flex:1;background:#0c1519;border-radius:10px;padding:8px 12px}
.vit small{display:block;color:#7f949b;font-size:.75rem}.vit b{font-size:1.5rem;color:#39ff88;font-variant-numeric:tabular-nums}
.bar{height:12px;background:#16252b;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#ff4d6d}
#msg{font-size:.92rem;line-height:1.5;color:#c9d6da;min-height:3em}
#res{font-size:1.6rem;color:#ffd166}
@media(max-width:800px){#app{flex-direction:column}#mon{width:100%;border-left:0;border-top:1px solid #16252b;flex:none;max-height:55%}}
</style></head><body>
<div id="app">
 <div id="left"><div id="loading">Loading…</div>
  <div id="stage"><video id="v" muted playsinline preload="auto"></video>
   <svg id="ov" viewBox="0 0 1 1" preserveAspectRatio="none"><polygon id="poly" points=""/><polygon id="dead" points=""/></svg>
   <div id="track"><i id="tf"></i></div><div id="hint">DRAG → TO TRAVEL</div><div id="cap"></div><div id="card"></div></div></div>
 <div id="mon"><div class="mh"><b>ER · MR. AHMED, 58</b><span id="clk">WAITING</span></div>
  <canvas id="ecg" height="150"></canvas>
  <div class="vit"><div><small>HEART RATE</small><b id="hr">78</b></div><div><small>BLOOD PRESSURE</small><b id="bp">120/80</b></div><div><small>ST SEGMENT</small><b id="st">normal</b></div></div>
  <div>Muscle alive: <b id="pct">100%</b></div><div class="bar"><i id="fill"></i></div>
  <div id="res"></div><p id="msg"></p><div class="row" id="acts"></div></div>
</div>
<script>
// ===== EDIT THIS PART =====
const VIDEO='../videos/heart-ischemia.mp4', FPS=29.97, sec=f=>f/FPS;
const T={first:.05,zoom:sec(35),flow:sec(104),plaque:sec(208),outside:sec(331),occlusion:sec(358)};
const AREA=[[0.52,0.78],[0.62,0.76],[0.68,0.82],[0.60,0.88],[0.52,0.85]];
const CAPS=[[T.first,'This dark muscle at the apex lives off ONE artery. Follow it.'],
 [T.zoom,'The Left Anterior Descending Artery (LAD) feeds the heart muscle with oxygen-rich blood.'],
 [T.flow,'In a healthy artery the channel is wide open.'],
 [T.plaque,'Fatty plaque builds up in the wall and narrows the channel. A damaged plaque forms a clot (thrombus).'],
 [T.outside,'From outside, the artery can still look almost normal.'],
 [T.occlusion,'The thrombus blocks the LAD completely. No blood reaches the muscle.']];
const STOP=[{t:sec(204),q:{question:'Fatty deposits are about to build up in the artery wall. What will happen to the channel inside?',options:[
 {text:'It becomes narrower',correct:true,explain:'Yes. The plaque grows into the channel, so less blood can pass.'},
 {text:'It becomes wider',correct:false,explain:'No. Plaque takes up space inside the channel.'},
 {text:'It stays the same',correct:false,explain:'Not quite. The plaque keeps growing.'}]}},
 {t:sec(241),q:{question:'A damaged plaque makes the body form a clot on it. What is this clot called?',options:[
 {text:'Thrombus',correct:true,explain:'Yes. A clot that forms and stays where it formed is a thrombus.'},
 {text:'Embolus',correct:false,explain:'An embolus travels through the blood. This clot stays put.'},
 {text:'Aneurysm',correct:false,explain:'An aneurysm is a bulge in the vessel wall, not a clot.'}]}}];
// Simplified numbers for teaching (please review the medical content).
const GAME={minPerSec:8,maxMin:300,tau:150,asp:.85,lytic:{delay:25,keep:.55},pci:{delay:80,keep:1}};
// ==========================
const $=i=>document.getElementById(i);
const v=$('v'),stage=$('stage'),left=$('left'),cap=$('cap'),card=$('card'),poly=$('poly'),dead=$('dead');
const h=(t,x,c)=>{const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e};
const fmt=m=>{const H=Math.floor(m/60),M=Math.floor(m%60);return(H?H+' h ':'')+M+' min'};
function show(t,x,acts,fb,cls){card.innerHTML='';card.style.display='block';card.append(h('h2',t),h('p',x));if(fb)card.append(h('p',fb,cls));
 const r=h('div','','row');(acts||[]).forEach(a=>{const b=h('button',a.label,'b'+(a.alt?' alt':''));b.onclick=a.fn;r.append(b)});card.append(r)}
const pts=a=>a.map(p=>p[0]+','+p[1]).join(' ');
const cen=()=>[AREA.reduce((s,p)=>s+p[0],0)/AREA.length,AREA.reduce((s,p)=>s+p[1],0)/AREA.length];
const showPoly=c=>{poly.setAttribute('points',pts(AREA));poly.setAttribute('class',c)};
function setDead(V){const k=Math.sqrt(Math.max(0,1-V/100)),c=cen();dead.setAttribute('points',pts(AREA.map(p=>[c[0]+(p[0]-c[0])*k,c[1]+(p[1]-c[1])*k])))}

// ---------- part A: the journey ----------
let journey=false,P=0,cur=0,si=0,asking=false,END=1,ending=false,capI=-1;
const tOf=p=>T.first+p*(END-T.first),pOf=t=>(t-T.first)/(END-T.first);
function ask(q,done){const render=(opts,fb)=>show('PREDICT',q.question,opts.map(o=>({label:o.text,alt:1,fn:()=>{
  if(o.correct)show('CORRECT',q.question,[{label:'Keep going',fn:()=>{card.style.display='none';done()}}],o.explain,'ok');
  else render(opts.filter(x=>x!==o),o.explain)}})),fb,'bad');render(q.options)}
function move(d){if(!journey||asking)return;const lim=si<STOP.length?pOf(STOP[si].t):1;P=Math.min(lim,Math.max(0,P+d));
 if(si<STOP.length&&P>=lim-1e-4){asking=true;ask(STOP[si].q,()=>{si++;asking=false})}else if(P>=.999&&si>=STOP.length&&!ending)finish()}
function caption(t){let i=-1;CAPS.forEach((c,n)=>{if(t>=c[0]-.01)i=n});if(i!==capI){capI=i;cap.style.opacity=0;setTimeout(()=>{cap.textContent=CAPS[i]?CAPS[i][1]:'';cap.style.opacity=1},220)}}
function begin(){card.style.display='none';poly.setAttribute('class','');journey=true;P=0;cur=T.first;$('hint').style.display='block'}
function finish(){ending=true;journey=false;stage.style.transition='filter 1.6s';stage.style.filter='brightness(.2)';
 setTimeout(()=>show('CODE RED','The artery is completely blocked. A patient like this is rolling into the emergency room right now, and now YOU are the doctor.',[{label:'Go to the ER',fn:finale}]),2600)}
let lx=0,ly=0,drag=false;
stage.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;$('hint').style.display='none';stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!drag)return;move(((e.clientX-lx)+(e.clientY-ly))/(stage.clientWidth*1.4));lx=e.clientX;ly=e.clientY});
stage.addEventListener('pointerup',()=>drag=false);
stage.addEventListener('wheel',e=>{e.preventDefault();move(e.deltaY/3000)},{passive:false});
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown')move(.02);if(e.key==='ArrowLeft'||e.key==='ArrowUp')move(-.02)});

// ---------- part B: the ER monitor ----------
let mode='',buf=new Float32Array(300),ph=0,stc=0;const G={};
const msg=t=>$('msg').textContent=t;
function acts(list){const a=$('acts');a.innerHTML='';list.forEach(x=>{const b=h('button',x.label,'b alt');b.onclick=x.fn;a.append(b)})}
function finale(){card.style.display='none';stage.style.filter='';cap.style.opacity=0;$('track').style.display='none';$('mon').style.display='flex';fit();v.currentTime=T.first;mode='er';lobby()}
function lobby(){Object.assign(G,{run:0,t:0,V:100,asp:0,plan:null,rep:0,tgt:100});showPoly('pulse');dead.style.display='block';setDead(100);$('res').textContent='';
 msg('Crushing chest pain. His LAD is blocked and the dark core will grow as the muscle dies. You can give aspirin and choose ONE way to open the artery. The cath lab is 80 minutes away.');
 acts([{label:'Start the clock',fn:startER}])}
function startER(){G.run=1;msg('');const A=$('acts');A.innerHTML='';const bt=x=>{const b=h('button',x,'b alt');A.append(b);return b};
 const bA=bt('Give aspirin'),bL=bt('Clot-busting drug (~25 min, opens it about half the time, bleeding risk)'),bP=bt('Stent in the cath lab (~80 min, opens it reliably)');
 bA.onclick=()=>{G.asp=1;bA.disabled=true;msg('Aspirin given. The muscle dies a little slower.')};
 bL.onclick=()=>{G.plan={at:G.t+GAME.lytic.delay,keep:GAME.lytic.keep,k:'l'};bL.disabled=bP.disabled=true;msg('The drug is running. It needs about 25 minutes.')};
 bP.onclick=()=>{G.plan={at:G.t+GAME.pci.delay,keep:GAME.pci.keep,k:'p'};bL.disabled=bP.disabled=true;msg('On the way to the cath lab. About 80 minutes.')}}
function endGame(){G.run=0;const pct=Math.round(G.V),st=pct>=50?3:pct>=35?2:pct>=20?1:0;
 msg((G.plan?'You saved '+pct+'% of the muscle. The artery opened '+fmt(G.plan.at)+' after the blockage'+(G.asp?', and you gave aspirin.':', but you gave no aspirin.'):'Nothing opened the artery. Only '+pct+'% of the muscle survived.')+' Time is muscle: every minute counts. With the cath lab 80 minutes away the stent was the better choice; if it was over about 2 hours away, the drug would win.');
 $('res').textContent='★★★'.slice(0,st)+'☆☆☆'.slice(0,3-st);acts([{label:'Try again',fn:lobby},{label:'Replay the journey',fn:()=>location.reload()}])}
function wave(f,st){const g=(c,w,a)=>a*Math.exp(-Math.pow((f-c)/w,2)),s=x=>1/(1+Math.exp(-x));
 return g(.12,.04,.12)-g(.255,.011,.14)+g(.28,.012,1)-g(.305,.012,.22)+st*s((f-.31)/.012)*(1-s((f-.62)/.03))+g(.62,.06,.28)}
function er(dt){
 if(G.run){const m=dt*GAME.minPerSec;G.t+=m;if(!G.rep)G.V-=G.V*(m/GAME.tau)*(G.asp?GAME.asp:1);
  if(G.plan&&!G.rep&&G.t>=G.plan.at){G.rep=1;G.tgt=G.V*G.plan.keep;poly.setAttribute('class','good');msg(G.plan.k==='p'?'The stent opened the artery. The muscle that was still alive is saved.':'The drug worked, but only partly: some muscle was already dead.')}
  if(G.rep)G.V+=(G.tgt-G.V)*.08;
  if(G.rep&&Math.abs(G.V-G.tgt)<.3){G.V=G.tgt;endGame()}else if(!G.plan&&G.t>=GAME.maxMin)endGame()}
 const hr=Math.round(78+35*Math.sin(Math.PI*(1-G.V/100))),c=$('ecg');stc+=((G.t>0?(G.rep?.08:.5):0)-stc)*.03;
 if(buf.length!==c.width)buf=new Float32Array(c.width);
 for(let i=0,n=Math.max(1,Math.round(dt*120));i<n;i++){ph+=hr/60/120;if(ph>=1)ph-=1;buf.copyWithin(0,1);buf[buf.length-1]=wave(ph,stc)}
 const x=c.getContext('2d'),W=c.width,H=c.height;x.clearRect(0,0,W,H);x.strokeStyle='#0f2a1c';x.lineWidth=1;
 for(let i=0;i<W;i+=30){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}
 x.beginPath();buf.forEach((y,i)=>i?x.lineTo(i,H*.7-y*H*.5):x.moveTo(i,H*.7-y*H*.5));x.strokeStyle='#39ff88';x.lineWidth=2;x.shadowColor='#39ff88';x.shadowBlur=8;x.stroke();x.shadowBlur=0;
 $('hr').textContent=hr;$('bp').textContent=Math.round(120-45*(1-G.V/100))+'/'+Math.round(80-25*(1-G.V/100));
 $('st').textContent=stc>.25?'ELEVATED':'normal';$('st').style.color=stc>.25?'#ff4d6d':'#39ff88';
 $('pct').textContent=Math.round(G.V)+'%';$('fill').style.width=Math.max(0,G.V)+'%';$('clk').textContent=G.t>0?'T+ '+fmt(G.t):'WAITING';setDead(G.V)}

// ---------- loop and load ----------
let last=performance.now();
function tick(now){const dt=Math.min((now-last)/1000,.1);last=now;
 if(journey){const tt=tOf(P);cur+=(tt-cur)*.2;if(Math.abs(tt-cur)<.002)cur=tt;if(!v.seeking&&Math.abs(v.currentTime-cur)>.012)v.currentTime=cur;caption(cur);$('tf').style.width=P*100+'%'}
 if(mode==='er')er(dt);requestAnimationFrame(tick)}
function fit(){const vw=v.videoWidth||4,vh=v.videoHeight||5,w=left.clientWidth-24,hh=left.clientHeight-24,s=Math.min(w/vw,hh/vh);
 stage.style.width=Math.floor(vw*s)+'px';stage.style.height=Math.floor(vh*s)+'px';const c=$('ecg');c.width=c.clientWidth||300}
addEventListener('resize',fit);
v.addEventListener('error',()=>$('loading').textContent='Could not load '+VIDEO);
v.addEventListener('canplay',()=>{END=v.duration-.05;fit();$('loading').style.display='none';caption(T.first);showPoly('pulse');
 show('JOURNEY INTO THE ARTERY','The dark muscle at the apex of the heart lives off ONE artery. Drag to travel inside it and answer the questions on the way. At the end, the patient arrives and you take over.',[{label:'Enter the artery',fn:begin}]);
 requestAnimationFrame(tick)},{once:true});
v.src=VIDEO;
</script></body></html>
