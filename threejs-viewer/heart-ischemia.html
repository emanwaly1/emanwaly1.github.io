<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ischemia lab</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:#f1f6f4;color:#22313a;font:500 1rem system-ui,sans-serif;display:flex;flex-direction:column}
  #viewer{flex:1;min-height:0;position:relative;display:flex;justify-content:center;align-items:center;gap:16px;overflow:hidden}
  #stage{position:relative;background:#000;border-radius:12px;overflow:hidden;touch-action:manipulation;flex:none}
  #stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  #ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #poly{fill:rgba(255,209,102,.25);stroke:#ffd166;stroke-width:3;vector-effect:non-scaling-stroke;display:none}
  #poly.good{fill:rgba(63,199,154,.3);stroke:#3fc79a;display:block}
  #poly.pulse{fill:rgba(217,86,111,.4);stroke:#d9566f;display:block;animation:glow 1.1s ease-in-out infinite}
  #poly.edit{display:block}
  @keyframes glow{50%{fill-opacity:.1}}
  #atag{position:absolute;transform:translate(-50%,-50%);background:#fffe;border:1px solid #d3e0dc;border-radius:999px;padding:3px 10px;font-size:.78rem;display:none;pointer-events:none;white-space:nowrap}
  .vdot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#ffd166;border:2px solid #fff;pointer-events:none}
  #loading{position:absolute;inset:0;display:grid;place-items:center;background:#f1f6f4;z-index:9;font-size:1.1rem;text-align:center;padding:20px}
  .dash{visibility:hidden;font-size:.8rem}
  .dash.side{width:190px;flex:none;background:#fff;border:1px solid #d3e0dc;border-radius:12px;padding:10px}
  .dash.over{position:absolute;left:8px;top:8px;width:34%;background:#000b;color:#fff;border-radius:8px;padding:6px;z-index:3;font-size:.66rem}
  .dash h4{font-size:.8rem;margin-bottom:6px}
  .dash canvas{width:100%;height:auto;display:block;border-radius:6px}
  .m{margin-top:6px}.m span{display:flex;justify-content:space-between}.m em{font-style:normal}
  .bar{height:6px;background:#8884;border-radius:3px;overflow:hidden;margin-top:2px}
  .bar b{display:block;height:100%;width:100%;background:#3fc79a}
  #panel{flex:none;max-height:42vh;overflow:auto;background:#fff;border-top:1px solid #d3e0dc;padding:12px 16px}
  #title{font-size:1.02rem;margin-bottom:2px}
  #text{font-size:.95rem;color:#3b4d56}
  #fb{font-size:.92rem;margin-top:6px}
  #fb.ok{color:#2f7d62}#fb.bad{color:#c0425b}
  #acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .act{font:500 .95rem system-ui,sans-serif;background:#d9566f;color:#fff;border:0;border-radius:999px;padding:9px 18px;cursor:pointer}
  .act:disabled{opacity:.45;cursor:default}
  .alt{background:#f1f6f4;color:#22313a;border:1px solid #d3e0dc}
  .act.alt[aria-pressed="true"]{background:#22313a;color:#fff;border-color:#22313a}
  #panel textarea{width:100%;height:92px;margin-top:6px;font:12px ui-monospace,Consolas,monospace}
  #panel .tool{font:500 .85rem system-ui,sans-serif;background:#fff;border:1px solid #d3e0dc;border-radius:999px;padding:5px 12px;cursor:pointer;margin:4px 4px 0 0}
</style>
</head>
<body>
<div id="viewer">
  <div id="loading">Loading lesson…</div>
  <div id="stage">
    <video id="v" muted playsinline preload="auto"></video>
    <svg id="ov" viewBox="0 0 1 1" preserveAspectRatio="none"><polygon id="poly" points=""/></svg>
    <div id="atag"></div>
  </div>
  <div class="dash" id="dash">
    <h4>Blood to the muscle</h4>
    <canvas id="thumb"></canvas>
    <div class="m"><span>Artery open <em id="vOpen">100%</em></span><div class="bar"><b id="bOpen"></b></div></div>
    <div class="m"><span>At rest <em id="vRest">100%</em></span><div class="bar"><b id="bRest"></b></div></div>
    <div class="m"><span>Running <em id="vRun">100%</em></span><div class="bar"><b id="bRun"></b></div></div>
  </div>
</div>
<div id="panel"><h3 id="title"></h3><p id="text"></p><p id="fb"></p><div id="acts"></div></div>

<script>
// ===== EDIT THIS PART ================================================
var VIDEO = '../videos/heart-ischemia.mp4';
var FPS = 29.97;
function sec(frame) { return frame / FPS; }   // Premiere frame number -> seconds

// Moments in the video (seconds). These come from the Premiere frames and will be tuned together.
var T = { first: 0.05, plaque: sec(208), thrombus: sec(241), outside: sec(331), occlusion: sec(358) };

// The apical myocardium on the first picture, as [x, y] fractions of the picture.
// Open this page with ?edit at the end of the address to draw it by clicking.
var AREA = [[0.52, 0.78], [0.62, 0.76], [0.68, 0.82], [0.60, 0.88], [0.52, 0.85]];

// Blood supply over the video, in percent (simplified teaching values: please review).
// The last row is moved to the end of the video automatically.
var FLOW = [
  { t: 0,           open: 100, rest: 100, run: 100 },
  { t: T.plaque,    open: 100, rest: 100, run: 100 },
  { t: T.thrombus,  open: 65,  rest: 100, run: 70 },
  { t: T.outside,   open: 15,  rest: 40,  run: 15 },
  { t: T.occlusion, open: 5,   rest: 15,  run: 0 },
  { t: 999,         open: 0,   rest: 0,   run: 0 }
];

// "Time is muscle" (simplified): 1 second = 10 minutes; muscle starts to die after 20 minutes, all dead at 6 hours.
var RESCUE = { speed: 10, deadStart: 20, deadFull: 360 };

var TEXT = {
  s1: { title: 'Step 1 · Find the area',
        ask: 'Find the darker area of heart muscle near the apex (the bottom of the heart) and tap it.',
        hint: 'Not there. Look near the bottom of the heart, at the apex.',
        reveal: 'It is here, near the apex.',
        ok: 'Yes. This is the apical myocardium. It depends on the Left Anterior Descending Artery.' },
  watch: { title: 'Follow the artery', text: 'A healthy artery feeds the muscle. 100% means all the blood it needs.' },
  lab: { title: 'Step 2 · Grow the plaque',
         text: 'Drag the slider to let the plaque grow. Watch the meters and the colour of the muscle.',
         rest: 'The artery is narrower, but the muscle is still fine at rest. Now press Running.',
         run: 'While running, the muscle gets less blood than it needs. A narrowing can stay silent until the heart works harder.' },
  q2: { question: 'The plaque cracks open. What does the body do?',
        options: [
          { text: 'It forms a blood clot (a thrombus) on the plaque', correct: true, explain: 'Yes. A cracked plaque is treated like a wound, and a clot starts to form on it.' },
          { text: 'It dissolves the plaque right away', correct: false, explain: 'No. A cracked plaque exposes the wall, and the blood starts to clot on it.' },
          { text: 'Nothing happens', correct: false, explain: 'Not quite. The cracked surface triggers clotting.' }
        ] },
  p2: { title: 'The clot grows', text: 'Watch the meters fall.' },
  rescue: { title: 'Final step · Time is muscle',
            text: 'The artery is completely blocked. The clock runs fast: 1 second here is about 10 minutes. Restore the blood flow before the muscle dies.' },
  tag: 'Apical myocardium'
};
// =====================================================================

var $ = function (id) { return document.getElementById(id); };
var v = $('v'), stage = $('stage'), viewer = $('viewer'), loadingEl = $('loading'), dash = $('dash');
var poly = $('poly'), atag = $('atag'), thumb = $('thumb');
var EDIT = new URLSearchParams(location.search).has('edit');
var stageHandler = null, stopAt = null, onStop = null, wrong = 0, phase = '', mode = 'rest';
var dashOn = false, rescueOn = false, rescueStart = 0, snap = document.createElement('canvas');

function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
function say(o) {
  $('title').textContent = o.title || '';
  $('text').textContent = o.text || '';
  $('fb').textContent = o.fb || '';
  $('fb').className = o.fbClass || '';
  var a = $('acts'); a.innerHTML = '';
  (o.acts || []).forEach(function (x) {
    var b = el('button', 'act' + (x.alt ? ' alt' : ''), x.label);
    b.addEventListener('click', x.fn);
    a.appendChild(b);
  });
}

// ---- the area ----
function centroid() { var x = 0, y = 0; AREA.forEach(function (p) { x += p[0]; y += p[1]; }); return [x / AREA.length, y / AREA.length]; }
function pointsAttr() { return AREA.map(function (p) { return p[0] + ',' + p[1]; }).join(' '); }
function placeTag(text) { var c = centroid(); atag.textContent = text; atag.style.left = c[0] * 100 + '%'; atag.style.top = c[1] * 100 + '%'; atag.style.display = 'block'; }
function showPoly(cls, label) { poly.removeAttribute('style'); poly.setAttribute('points', pointsAttr()); poly.setAttribute('class', cls); if (label) placeTag(label); }
function hidePoly() { poly.removeAttribute('style'); poly.setAttribute('class', ''); atag.style.display = 'none'; }
function hitArea(p) {
  var x = p.px, y = p.py, inside = false;
  for (var i = 0, j = AREA.length - 1; i < AREA.length; j = i++) {
    var xi = AREA[i][0], yi = AREA[i][1], xj = AREA[j][0], yj = AREA[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  var c = centroid();
  return inside || Math.hypot((x - c[0]) * p.w, (y - c[1]) * p.h) <= 0.06 * p.w;
}
function point(e) { var b = stage.getBoundingClientRect(); return { px: (e.clientX - b.left) / b.width, py: (e.clientY - b.top) / b.height, w: b.width, h: b.height }; }
stage.addEventListener('pointerup', function (e) { if (stageHandler) stageHandler(point(e)); });

function seekTo(t) {
  return new Promise(function (res) {
    if (Math.abs(v.currentTime - t) < 0.02) return res();
    v.addEventListener('seeked', function () { res(); }, { once: true });
    v.currentTime = t;
  });
}
function play() { v.play().catch(function () {}); }
function playTo(t, cb) { stopAt = t; onStop = cb; play(); }

// ---- dashboard: the muscle reacts to the blood supply ----
function flowAt(t) {
  var a = FLOW[0];
  for (var i = 1; i < FLOW.length; i++) {
    var b = FLOW[i];
    if (t <= b.t) {
      var k = Math.max(0, Math.min(1, (t - a.t) / ((b.t - a.t) || 1)));
      return { open: a.open + (b.open - a.open) * k, rest: a.rest + (b.rest - a.rest) * k, run: a.run + (b.run - a.run) * k };
    }
    a = b;
  }
  return FLOW[FLOW.length - 1];
}
function colorFor(val, alpha) {
  var h = val >= 50 ? 40 + (val - 50) / 50 * 100 : val / 50 * 40;
  var s = val >= 20 ? 75 : 15 + val / 20 * 60;
  var l = val >= 20 ? 50 : 20 + val / 20 * 30;
  return 'hsla(' + h + ',' + s + '%,' + l + '%,' + (alpha === undefined ? 1 : alpha) + ')';
}
function updateDash() {
  var f = flowAt(v.currentTime);
  [['Open', f.open], ['Rest', f.rest], ['Run', f.run]].forEach(function (r) {
    $('v' + r[0]).textContent = Math.round(r[1]) + '%';
    var b = $('b' + r[0]); b.style.width = r[1] + '%'; b.style.background = colorFor(r[1]);
  });
  var c = thumb.getContext('2d');
  c.drawImage(snap, 0, 0, thumb.width, thumb.height);
  c.beginPath();
  AREA.forEach(function (p, i) { var X = p[0] * thumb.width, Y = p[1] * thumb.height; if (i) c.lineTo(X, Y); else c.moveTo(X, Y); });
  c.closePath();
  c.fillStyle = colorFor(mode === 'run' ? f.run : f.rest, 0.6); c.fill();
  c.lineWidth = 2; c.strokeStyle = '#fff'; c.stroke();
}
function showDash(on) { dashOn = on; dash.style.visibility = on ? 'visible' : 'hidden'; }

// ---- the loop ----
function fmt(m) { m = Math.round(m); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; }
function lerp(a, b, k) { return Math.round(a + (b - a) * k); }
function deadAt(m) { return Math.max(0, Math.min(1, (m - RESCUE.deadStart) / (RESCUE.deadFull - RESCUE.deadStart))); }
function loop() {
  if (stopAt !== null && v.currentTime >= stopAt) { var cb = onStop; stopAt = null; onStop = null; v.pause(); if (cb) cb(); }
  if (dashOn) updateDash();
  if (rescueOn) {
    var m = (performance.now() - rescueStart) / 1000 * RESCUE.speed, d = deadAt(m);
    poly.style.fill = 'rgba(' + lerp(255, 30, d) + ',' + lerp(209, 34, d) + ',' + lerp(102, 38, d) + ',' + (0.45 + 0.3 * d) + ')';
    poly.style.stroke = 'rgb(' + lerp(255, 90, d) + ',' + lerp(209, 90, d) + ',' + lerp(102, 90, d) + ')';
    var st = d <= 0 ? 'Ischemic: the muscle can still be saved' : d < 0.95 ? 'Injury is spreading: part of the muscle is dying' : 'Infarction: this muscle is dead';
    placeTag(st);
    $('fb').textContent = 'Time since the blockage: ' + fmt(m);
    if (m >= RESCUE.deadFull) finishRescue(false, m);
  }
  requestAnimationFrame(loop);
}
v.addEventListener('ended', function () { if (phase === 'play2') rescue(); });

// ---- a question that blocks the video until it is answered correctly ----
function ask(q, onDone) {
  function render(opts, fb) {
    say({ title: 'Question', text: q.question, fb: fb || '', fbClass: fb ? 'bad' : '',
      acts: opts.map(function (o) {
        return { label: o.text, alt: true, fn: function () {
          if (o.correct) say({ title: 'Question', text: q.question, fb: o.explain, fbClass: 'ok', acts: [{ label: 'Continue', fn: onDone }] });
          else render(opts.filter(function (x) { return x !== o; }), o.explain);
        } };
      }) });
  }
  render(q.options);
}

// ---- step 1: find the shape of the area ----
function start() {
  phase = 'find'; wrong = 0; stageHandler = null; rescueOn = false; stopAt = null;
  v.pause(); hidePoly(); showDash(false);
  seekTo(T.first).then(function () {
    var base = { title: TEXT.s1.title, text: TEXT.s1.ask };
    var next = [{ label: 'Next', fn: function () {
      hidePoly();
      say({ title: TEXT.watch.title, text: TEXT.watch.text });
      showDash(true);
      playTo(T.plaque, lab);
    } }];
    say(base);
    stageHandler = function (p) {
      if (hitArea(p)) {
        stageHandler = null; showPoly('good', TEXT.tag);
        say({ title: base.title, text: base.text, fb: TEXT.s1.ok, fbClass: 'ok', acts: next });
      } else if (++wrong >= 3) {
        stageHandler = null; showPoly('pulse', TEXT.tag);
        say({ title: base.title, text: base.text, fb: TEXT.s1.reveal, fbClass: 'ok', acts: next });
      } else {
        say({ title: base.title, text: base.text, fb: TEXT.s1.hint, fbClass: 'bad' });
      }
    };
  });
}

// ---- step 2: grow the plaque yourself ----
function lab() {
  phase = 'lab'; mode = 'rest';
  var ranRun = false, reached = false;
  say({ title: TEXT.lab.title, text: TEXT.lab.text });
  var acts = $('acts');
  var sl = el('input'); sl.type = 'range'; sl.min = 0; sl.max = 1000; sl.value = 0; sl.style.width = '100%';
  var bRest = el('button', 'act alt', 'Resting'), bRun = el('button', 'act alt', 'Running');
  var crack = el('button', 'act', 'The plaque cracks'); crack.disabled = true;
  function setMode(m) { mode = m; bRest.setAttribute('aria-pressed', m === 'rest'); bRun.setAttribute('aria-pressed', m === 'run'); check(); }
  function check() {
    if (sl.value / 1000 >= 0.9) {
      reached = true;
      if (mode === 'run') { ranRun = true; $('fb').textContent = TEXT.lab.run; $('fb').className = 'ok'; }
      else if (!ranRun) { $('fb').textContent = TEXT.lab.rest; $('fb').className = 'ok'; }
    }
    crack.disabled = !(reached && ranRun);
  }
  sl.addEventListener('input', function () {
    v.currentTime = T.plaque + (sl.value / 1000) * (T.thrombus - T.plaque - 0.03);
    check();
  });
  bRest.addEventListener('click', function () { setMode('rest'); });
  bRun.addEventListener('click', function () { setMode('run'); });
  crack.addEventListener('click', function () {
    ask(TEXT.q2, function () { phase = 'play2'; say({ title: TEXT.p2.title, text: TEXT.p2.text }); play(); });
  });
  var row = el('div'); row.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;width:100%';
  row.appendChild(bRest); row.appendChild(bRun); row.appendChild(crack);
  var box = el('div'); box.style.width = '100%';
  box.appendChild(sl); box.appendChild(row);
  acts.appendChild(box);
  setMode('rest');
  seekTo(T.plaque);
}

// ---- final step: time is muscle ----
function rescue() {
  phase = 'rescue'; rescueOn = false; stageHandler = null; showDash(false);
  seekTo(T.first).then(function () {
    poly.setAttribute('points', pointsAttr()); poly.setAttribute('class', 'edit');
    poly.style.fill = 'rgba(255,209,102,.45)'; poly.style.stroke = '#ffd166';
    placeTag('Ischemic: the muscle can still be saved');
    say({ title: TEXT.rescue.title, text: TEXT.rescue.text, acts: [{ label: 'Start the clock', fn: startClock }] });
  });
}
function startClock() {
  rescueStart = performance.now(); rescueOn = true;
  say({ title: TEXT.rescue.title, text: 'Restore the blood flow as early as you can.', acts: [{ label: 'Restore blood flow', fn: function () {
    finishRescue(true, (performance.now() - rescueStart) / 1000 * RESCUE.speed);
  } }] });
}
function finishRescue(restored, m) {
  rescueOn = false;
  var saved = Math.round(100 * (1 - deadAt(m)));
  poly.style.fill = restored ? (saved >= 60 ? 'rgba(63,199,154,.4)' : 'rgba(255,209,102,.4)') : 'rgba(30,34,38,.8)';
  poly.style.stroke = restored ? '#3fc79a' : '#555';
  var acts = [{ label: 'Try again', fn: rescue }, { label: 'Replay lesson', alt: true, fn: start }];
  if (restored) {
    placeTag('Blood flow restored');
    say({ title: 'Blood flow restored', text: 'You restored the blood flow after ' + fmt(m) + '. Apical myocardium saved: ' + saved + '%.',
          fb: 'Every minute counts: the earlier blood flow is restored, the more muscle survives.', fbClass: 'ok', acts: acts });
  } else {
    placeTag('Infarction');
    say({ title: 'Too late', text: 'After about 6 hours the apical myocardium is dead (a myocardial infarction).', fb: 'Try again and restore the blood flow earlier.', fbClass: 'bad', acts: acts });
  }
}

// ---- edit mode: draw the area by clicking points ----
function buildEdit() {
  var p = $('panel'); p.innerHTML = '';
  p.appendChild(el('p', '', 'Edit mode. Click around the dark area (the apical myocardium) to place points, one after another around its edge.'));
  var out = el('textarea'); out.readOnly = true;
  var tl = el('input'); tl.type = 'range'; tl.min = 0; tl.max = 1000; tl.value = 0; tl.style.width = '100%';
  var tr = el('p', '', 'Video length: ' + v.duration.toFixed(2) + ' s. Drag to see any moment of the video.');
  tl.addEventListener('input', function () {
    v.currentTime = (tl.value / 1000) * v.duration;
    tr.textContent = 'Video time: ' + v.currentTime.toFixed(2) + ' s (of ' + v.duration.toFixed(2) + ' s)';
  });
  AREA.length = 0;
  function refresh() {
    stage.querySelectorAll('.vdot').forEach(function (d) { d.remove(); });
    AREA.forEach(function (q) { var d = el('div', 'vdot'); d.style.left = q[0] * 100 + '%'; d.style.top = q[1] * 100 + '%'; stage.appendChild(d); });
    if (AREA.length > 2) { poly.setAttribute('points', pointsAttr()); poly.setAttribute('class', 'edit'); } else poly.setAttribute('class', '');
    out.value = 'var AREA = [' + AREA.map(function (q) { return '[' + q[0] + ', ' + q[1] + ']'; }).join(', ') + '];';
  }
  var undo = el('button', 'tool', 'Undo last'), clear = el('button', 'tool', 'Clear'), copy = el('button', 'tool', 'Copy');
  undo.addEventListener('click', function () { AREA.pop(); refresh(); });
  clear.addEventListener('click', function () { AREA.length = 0; refresh(); });
  copy.addEventListener('click', function () { out.select(); navigator.clipboard.writeText(out.value).catch(function () { document.execCommand('copy'); }); });
  p.appendChild(undo); p.appendChild(clear); p.appendChild(copy); p.appendChild(tr); p.appendChild(tl); p.appendChild(out);
  stageHandler = function (pt) { AREA.push([+pt.px.toFixed(3), +pt.py.toFixed(3)]); refresh(); };
  stage.style.cursor = 'crosshair';
  seekTo(T.first).then(refresh);
}

// ---- layout and load ----
function fit() {
  var wide = viewer.clientWidth >= 640;
  var vw = v.videoWidth || 4, vh = v.videoHeight || 5;
  var w = viewer.clientWidth - 16 - (wide ? 206 : 0), h = viewer.clientHeight - 16;
  var s = Math.min(w / vw, h / vh);
  stage.style.width = Math.floor(vw * s) + 'px';
  stage.style.height = Math.floor(vh * s) + 'px';
}
function place() {
  var wide = viewer.clientWidth >= 640;
  dash.className = 'dash ' + (wide ? 'side' : 'over');
  dash.style.visibility = dashOn ? 'visible' : 'hidden';
  (wide ? viewer : stage).appendChild(dash);
  fit();
}
window.addEventListener('resize', place);
v.addEventListener('loadedmetadata', fit);
v.addEventListener('error', function () { loadingEl.textContent = 'Could not load ' + VIDEO; });
v.addEventListener('canplay', function () {
  FLOW[FLOW.length - 1].t = v.duration;
  snap.width = thumb.width = 160;
  snap.height = thumb.height = Math.round(160 * (v.videoHeight || 5) / (v.videoWidth || 4));
  place(); loadingEl.style.display = 'none';
  seekTo(T.first).then(function () {
    snap.getContext('2d').drawImage(v, 0, 0, snap.width, snap.height);
    if (EDIT) buildEdit(); else start();
    loop();
  });
}, { once: true });
v.src = VIDEO;
</script>
</body>
</html>
