<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Viewer</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:#f1f6f4;color:#22313a;font:500 1rem system-ui,sans-serif;display:flex;flex-direction:column}
  #viewer{flex:1;min-height:0;position:relative;touch-action:none}
  #viewer canvas{display:block;width:100%;height:100%}
  #label{position:absolute;left:16px;bottom:16px;background:#fff;border:1px solid #d3e0dc;border-radius:999px;padding:8px 18px}
  #hint{position:absolute;right:16px;bottom:16px;color:#5a6b73;font-size:.9rem}
</style>
</head>
<body>
<div id="viewer">
  <div id="label">Click a part to see its name</div>
  <div id="hint">Drag to rotate · Scroll to zoom</div>
</div>

<!-- Three.js is loaded from a CDN, pinned to one version -->
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const MODEL_FILE = 'eye.glb';  // <- put your exported model next to this file

const box = document.getElementById('viewer');
const label = document.getElementById('label');

// 1) scene, camera, renderer
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf1f6f4);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
box.appendChild(renderer.domElement);

// 2) lights
// Environment lighting: without it, shiny/metallic materials from Blender look black.
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0xbfd3cd, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(3, 5, 4);
scene.add(sun);

// 3) mouse / touch controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotateSpeed = 1.5;

// 4) put the model in view, whatever its size
let model;
const FIX_MATERIALS = true; // set to false if the fixes below change your look in a way you don't like
function setModel(obj) {
  model = obj;
  if (FIX_MATERIALS) {
    obj.traverse((o) => {
      if (!o.isMesh || !o.material) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach((m) => {
        m.side = THREE.DoubleSide;                                  // flipped normals no longer look black
        if (m.metalness !== undefined && m.metalness > 0.5) m.metalness = 0.2; // fully metallic = black here
      });
    });
  }
  scene.add(obj);
  const b = new THREE.Box3().setFromObject(obj);
  const size = b.getSize(new THREE.Vector3());
  const center = b.getCenter(new THREE.Vector3());
  const dist = Math.max(size.x, size.y, size.z) * 1.8;
  camera.position.set(center.x, center.y, center.z + dist);
  camera.near = dist / 100;
  camera.far = dist * 100;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();
}

// 5) load your model (a placeholder shows if the file is missing)
const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(draco);
gltfLoader.setMeshoptDecoder(MeshoptDecoder);
gltfLoader.load(
  MODEL_FILE,
  (gltf) => setModel(gltf.scene),
  undefined,
  (err) => {
    console.error('Eye model failed to load:', err);
    const m = new THREE.Mesh(
      new THREE.TorusKnotGeometry(1, 0.35, 128, 16),
      new THREE.MeshStandardMaterial({ color: 0xd9566f, roughness: 0.4 })
    );
    m.name = 'Placeholder (add model.glb)';
    setModel(m);
  }
);

// 6) click a part -> show its name (the object names you set in Blender)
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let down = [0, 0];
renderer.domElement.addEventListener('pointerdown', (e) => {
  down = [e.clientX, e.clientY];
  controls.autoRotate = false;
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!model || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return; // it was a drag
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(model, true)[0];
  label.textContent = hit ? (hit.object.name || '(unnamed part)') : 'Click a part to see its name';
});

// 7) keep it sized to the page and draw every frame
function resize() {
  const w = box.clientWidth, h = box.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
