<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heart 3D Viewer</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:#f1f6f4;color:#22313a;font:500 1rem system-ui,sans-serif;display:flex;flex-direction:column}
  #viewer{flex:1;min-height:0;position:relative;touch-action:none;overflow:hidden}
  #viewer canvas{display:block;width:100%;height:100%}
  #loading{position:absolute;inset:0;display:grid;place-items:center;background:#f1f6f4;z-index:9;font-size:1.1rem;text-align:center;padding:20px}
  #label{position:absolute;left:16px;top:16px;background:#fff;border:1px solid #d3e0dc;border-radius:999px;padding:8px 18px;max-width:70%}
  #hint{position:absolute;right:16px;top:22px;color:#5a6b73;font-size:.9rem}
  #bar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:calc(100% - 24px);z-index:3}
  .grp{display:flex;gap:4px;background:#fffd;border:1px solid #d3e0dc;border-radius:999px;padding:4px}
  #bar button{font:500 .92rem system-ui,sans-serif;background:transparent;border:0;border-radius:999px;padding:8px 16px;color:#22313a;cursor:pointer}
  #bar button:hover{background:#eef4f2}
  #bar button[aria-pressed="true"]{background:#d9566f;color:#fff}
  #bar button:disabled{opacity:.4;cursor:not-allowed}
  #divider{position:absolute;top:0;bottom:0;left:50%;width:44px;margin-left:-22px;cursor:ew-resize;touch-action:none;display:none;z-index:2}
  #divider::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px #0002}
  #divider i{position:absolute;left:6px;top:50%;margin-top:-16px;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 1px 6px #0003;display:grid;place-items:center;font-style:normal;color:#d9566f}
  .tag{position:absolute;top:64px;background:#fffd;border:1px solid #d3e0dc;border-radius:999px;padding:4px 12px;font-size:.85rem;display:none;z-index:1}
  #tagL{left:16px}#tagR{right:16px}
@supports (height:100dvh){body{height:100dvh}}
@media (max-width:700px){
  #hint{display:none}
  #label{left:8px;right:8px;top:8px;max-width:none;border-radius:14px;padding:7px 14px;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{top:54px;font-size:.78rem;padding:3px 10px}
  #tagL{left:8px}#tagR{right:8px}
  #bar{bottom:8px;gap:6px;max-width:calc(100% - 16px)}
  #bar button{padding:7px 12px;font-size:.85rem}
}
</style>
</head>
<body>
<div id="viewer">
  <div id="loading">Loading heart…</div>
  <div id="label">Click a part to see its name</div>
  <div id="hint">Drag to rotate · Scroll to zoom</div>
  <div class="tag" id="tagL">External</div>
  <div class="tag" id="tagR">Cross section</div>
  <div id="divider"><i>↔</i></div>
  <div id="bar">
    <div class="grp" id="modes">
      <button data-mode="external" aria-pressed="true">External</button>
      <button data-mode="cross" aria-pressed="false">Cross section</button>
      <button data-mode="compare" aria-pressed="false">Compare</button>
    </div>
    <div class="grp">
      <button id="beat" aria-pressed="false">♥ Heartbeat</button>
      <button id="spin" aria-pressed="true">Rotate</button>
      <button id="reset">Reset view</button>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// The two model files (put them next to this page). Export both from the same
// scene so they share one origin and scale: that is what makes Compare line up.
const EXTERNAL_FILE = 'heart.glb';
const CROSS_FILE = 'heart-cross-section.glb';

const box = document.getElementById('viewer');
const label = document.getElementById('label');
const loadingEl = document.getElementById('loading');
const divider = document.getElementById('divider');
const tags = [document.getElementById('tagL'), document.getElementById('tagR')];
const modeBtns = [...document.querySelectorAll('#modes button')];
const beatBtn = document.getElementById('beat');
const spinBtn = document.getElementById('spin');

// scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf1f6f4);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;   // overall brightness (1 = default)
box.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0xbfd3cd, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(3, 5, 4);
scene.add(sun);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotateSpeed = 1.2;
spinBtn.setAttribute('aria-pressed', controls.autoRotate);

const pivot = new THREE.Group();   // both models live here (the heartbeat scales it)
scene.add(pivot);

// loading
const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);
try { loader.setMeshoptDecoder((await import('three/addons/libs/meshopt_decoder.module.js')).MeshoptDecoder); } catch (e) { console.warn('Meshopt decoder not available', e); }

const load = (file) => new Promise((res, rej) => loader.load(file, (g) => res(g.scene), undefined, rej));

function prepare(obj, layer) {
  obj.traverse((o) => {
    o.layers.set(layer);               // layer 1 = external, layer 2 = cross section (used by Compare)
    if (!o.isMesh || !o.material) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => {
      m.side = THREE.DoubleSide;
      if (m.metalness !== undefined && m.metalness > 0.5) m.metalness = 0.2;
      m.userData.base = { t: m.transparent, o: m.opacity, d: m.depthWrite };
    });
  });
}

function setOpacity(model, v) {      // used for the cross-fade
  model.traverse((o) => {
    if (!o.isMesh) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => {
      const b = m.userData.base, before = m.transparent;
      if (v >= 1) { m.transparent = b.t; m.opacity = b.o; m.depthWrite = b.d; }
      else { m.transparent = true; m.opacity = b.o * v; m.depthWrite = false; }
      if (m.transparent !== before) m.needsUpdate = true;
    });
  });
}

// modes: external | cross | compare
const M = { external: null, cross: null };
let mode = null, trans = null, split = 0.5, home = null;

function finishTrans() {
  trans.from.visible = false;
  setOpacity(trans.from, 1);
  setOpacity(trans.to, 1);
  trans = null;
}

function setMode(m) {
  if (m === mode || !M.external && m === 'external' || !M.cross && m === 'cross') return;
  if (trans) finishTrans();
  clearSelection();
  const prev = mode;
  mode = m;
  modeBtns.forEach((b) => b.setAttribute('aria-pressed', b.dataset.mode === m));
  const compare = m === 'compare';
  divider.style.display = compare ? 'block' : 'none';
  tags.forEach((t) => (t.style.display = compare ? 'block' : 'none'));
  if (compare) { M.external.visible = true; M.cross.visible = true; return; }
  const next = M[m];
  const old = prev === 'external' || prev === 'cross' ? M[prev] : null;
  next.visible = true;
  if (old && old !== next) trans = { from: old, to: next, t0: performance.now() };
  else { if (M.external) M.external.visible = next === M.external; if (M.cross) M.cross.visible = next === M.cross; }
}

Promise.allSettled([load(EXTERNAL_FILE), load(CROSS_FILE)]).then(([a, b]) => {
  if (a.status === 'fulfilled') { M.external = a.value; prepare(M.external, 1); }
  if (b.status === 'fulfilled') { M.cross = b.value; prepare(M.cross, 2); }
  const base = M.external || M.cross;
  if (!base) { loadingEl.textContent = 'Could not load ' + EXTERNAL_FILE + ' or ' + CROSS_FILE; return; }

  const bb = new THREE.Box3().setFromObject(base);
  const size = bb.getSize(new THREE.Vector3());
  const center = bb.getCenter(new THREE.Vector3());
  [M.external, M.cross].forEach((m) => { if (m) { m.position.sub(center); pivot.add(m); m.visible = false; } });

  const dist = Math.max(size.x, size.y, size.z) * 1.8;
  camera.position.set(0, 0, dist);
  camera.near = dist / 100;
  camera.far = dist * 100;
  camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.update();
  home = camera.position.clone();

  modeBtns.forEach((btn) => {
    const k = btn.dataset.mode;
    if ((k === 'external' && !M.external) || (k === 'cross' && !M.cross) || (k === 'compare' && !(M.external && M.cross))) btn.disabled = true;
  });
  if (!M.external) label.textContent = 'Could not load ' + EXTERNAL_FILE;
  if (!M.cross) label.textContent = 'Could not load ' + CROSS_FILE;
  setMode(M.external ? 'external' : 'cross');
  loadingEl.style.display = 'none';
});

// buttons
document.getElementById('modes').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b && !b.disabled) setMode(b.dataset.mode);
});
let beat = false, amp = 0;
beatBtn.addEventListener('click', () => { beat = !beat; beatBtn.setAttribute('aria-pressed', beat); });
spinBtn.addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; spinBtn.setAttribute('aria-pressed', controls.autoRotate); });
document.getElementById('reset').addEventListener('click', () => { if (home) { camera.position.copy(home); controls.target.set(0, 0, 0); controls.update(); } });

// Compare divider
let dragging = false;
function setSplit(x) {
  const r = box.getBoundingClientRect();
  split = Math.min(0.95, Math.max(0.05, (x - r.left) / r.width));
  divider.style.left = split * 100 + '%';
}
divider.addEventListener('pointerdown', (e) => { dragging = true; divider.setPointerCapture(e.pointerId); e.preventDefault(); });
divider.addEventListener('pointermove', (e) => { if (dragging) setSplit(e.clientX); });
divider.addEventListener('pointerup', () => { dragging = false; });
divider.addEventListener('pointercancel', () => { dragging = false; });

// click a part -> name + highlight
const ray = new THREE.Raycaster();
ray.layers.enableAll();
const mouse = new THREE.Vector2();
let down = [0, 0], selected = null;

function clearSelection() {
  if (selected) { selected.material = selected.userData.origMat; selected = null; }
  label.textContent = 'Click a part to see its name';
}
renderer.domElement.addEventListener('pointerdown', (e) => {
  down = [e.clientX, e.clientY];
  controls.autoRotate = false;
  spinBtn.setAttribute('aria-pressed', false);
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const side = mode === 'compare' ? [(e.clientX - r.left) / r.width < split ? M.external : M.cross] : [M.external, M.cross].filter((m) => m && m.visible);
  const meshes = [];
  side.forEach((m) => m.traverse((o) => { if (o.isMesh) meshes.push(o); }));
  const hit = ray.intersectObjects(meshes, false)[0];
  clearSelection();
  if (hit) {
    selected = hit.object;
    selected.userData.origMat = selected.material;
    selected.material = selected.material.clone();
    selected.material.emissive = new THREE.Color(0xffaa00);
    selected.material.emissiveIntensity = 0.5;
    label.textContent = selected.name.replace(/_/g, ' ') || '(unnamed part)';
  }
});

function resize() {
  const w = box.clientWidth, h = box.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

renderer.setAnimationLoop(() => {
  controls.update();

  // heartbeat: a "lub-dub" pulse (about 75 beats per minute)
  amp += ((beat ? 1 : 0) - amp) * 0.1;
  const t = (performance.now() / 1000) % 0.8;
  const p = Math.exp(-(((t - 0.08) / 0.045) ** 2)) + 0.65 * Math.exp(-(((t - 0.3) / 0.06) ** 2));
  pivot.scale.setScalar(1 + 0.04 * p * amp);

  // cross-fade between External and Cross section
  if (trans) {
    const k = Math.min(1, (performance.now() - trans.t0) / 450);
    const e = k * k * (3 - 2 * k);
    setOpacity(trans.from, 1 - e);
    setOpacity(trans.to, e);
    if (k === 1) finishTrans();
  }

  const w = box.clientWidth, h = box.clientHeight;
  if (mode === 'compare') {
    const x = Math.round(w * split);
    renderer.setScissorTest(true);
    renderer.setViewport(0, 0, w, h);
    camera.layers.set(0); camera.layers.enable(1);
    renderer.setScissor(0, 0, x, h);
    renderer.render(scene, camera);
    camera.layers.set(0); camera.layers.enable(2);
    renderer.setScissor(x, 0, w - x, h);
    renderer.render(scene, camera);
  } else {
    renderer.setScissorTest(false);
    camera.layers.enableAll();
    renderer.render(scene, camera);
  }
});
</script>
<script>
// shows the real reason on screen if the viewer cannot start
(function(){
  var el=document.getElementById('loading');
  function say(t){ if(el && el.style.display!=='none') el.textContent=t; }
  var ms=document.querySelectorAll('script[type=module]');
  ms[ms.length-1].addEventListener('error',function(){ say('A library failed to load. Check your internet connection.'); });
  window.addEventListener('error',function(e){ say('Error: '+e.message); });
  window.addEventListener('unhandledrejection',function(e){ say('Error: '+((e.reason&&e.reason.message)||e.reason)); });
})();
</script>
</body>
</html>
