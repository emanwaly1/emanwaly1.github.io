<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canine lungs – interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#22313a;--dim:#5a6b73;--line:#d3e0dc;--card:#fff;--bg:#f1f6f4;--coral:#d9566f;--teal:#3f8f89;--ok:#2e8b57;
--display:"Bricolage Grotesque",system-ui,sans-serif;--sans:"Karla",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--card);color:var(--ink);font:400 1rem/1.5 var(--sans)}
.app{display:flex;flex-direction:column;height:100%;padding:10px;gap:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar button,.fileBtn{font:500 .95rem var(--sans);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 16px;color:var(--ink);cursor:pointer}
.bar button:hover,.fileBtn:hover{background:var(--bg)}
.bar button.on{background:var(--coral);border-color:var(--coral);color:#fff}
.fileBtn{display:none}#picker{display:none}
.box{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:14px;overflow:hidden}
.stage{position:relative}
.art{position:absolute;top:0;height:100%}
.art img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:filter .15s,opacity .2s}
.art img.hover{filter:brightness(1.12) drop-shadow(0 0 6px #fff)}
.art img.sel{filter:brightness(1.18) drop-shadow(0 0 8px #fff)}
.art img.dim{opacity:.3}
.art img.overlay{opacity:0}.art img.overlay.on{opacity:.75}
svg.lab{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lbl{opacity:0;transition:opacity .2s}.lbl.show{opacity:1}
.lbl polyline{stroke:var(--ink);stroke-width:1.5;fill:none}
.lbl circle{fill:var(--ink)}.lbl text{fill:var(--ink);font-weight:700;font-family:var(--sans)}
.info{flex:none;height:92px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.info h2{font:700 1.15rem var(--display);color:var(--coral);margin-bottom:2px}
.info p{color:var(--dim);font-size:.95rem}
.q{font:700 1.15rem var(--display)}.q span{color:var(--coral)}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--coral);font-weight:700}
.msg{padding:24px;text-align:center;color:var(--dim);font-size:.95rem;line-height:1.7}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button id="bExplore" class="on">Explore</button>
    <button id="bQuiz">Quiz</button>
    <button id="bLabels">All labels</button>
    <button id="bOverlay" style="display:none">Pneumonia overlay</button>
    <label class="fileBtn" id="pickBtn" for="picker">Load PNG layers…</label>
    <input id="picker" type="file" accept="image/png" multiple>
  </div>
  <div class="box" id="box"><div class="stage" id="stage"><div class="msg">Loading…</div></div></div>
  <div class="info" id="infoBody"></div>
</div>

<script>
/* ===== EDIT HERE: one entry per PNG layer = images/lungs/<id>.png, listed bottom → top ===== */
const FOLDER = "images/lungs/";
const PARTS = [
 {id:"left-caudal",  name:"Left caudal lobe",   fn:"Largest lobe of the left lung, lying over the diaphragm."},
 {id:"left-cranial", name:"Left cranial lobe",  fn:"The left lung has only 2 lobes. This one has a cranial and a caudal part, partly separated."},
 {id:"right-caudal", name:"Right caudal lobe",  fn:"Largest lobe of the right lung, over the diaphragm."},
 {id:"right-middle", name:"Right middle lobe",  fn:"Lies ventrally beside the heart. In aspiration pneumonia the cranioventral lobes, including this one, are typically hit first."},
 {id:"right-cranial",name:"Right cranial lobe", fn:"First of the 4 right lobes: cranial, middle, caudal and accessory."},
 {id:"accessory",    name:"Accessory lobe",     fn:"Small right lobe that wraps around the caudal vena cava, tucked medially."},
 {id:"bronchial-tree",name:"Bronchial tree",    fn:"Principal bronchi, then lobar, segmental bronchi and bronchioles, ending in alveoli where gas exchange happens."},
 {id:"trachea",      name:"Trachea",            fn:"Airway reinforced with C-shaped cartilage rings. Divides at the carina into the two principal bronchi."}
];
const OVERLAY_ID = "pneumonia";   // optional full-canvas PNG: images/lungs/pneumonia.png
const HOME = "<p>Hover or tap a lobe to see its name. Switch to Quiz to test yourself.</p>";
/* ======================================================================================== */

const $=id=>document.getElementById(id), stage=$("stage"), box=$("box"), infoBody=$("infoBody");
const NS="http://www.w3.org/2000/svg", byId=id=>PARTS.find(p=>p.id===id);
let W=0,H=0,M=0,ratio=0,mode="explore",allLabels=false,selected=null,hovered=null,target=null,score=0,tries=0,locked=false,art,layers=[],overlayImg=null;

const loadImg=u=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u;});

function fit(){ if(!ratio) return; const w=Math.min(box.clientWidth,box.clientHeight*ratio); stage.style.width=w+"px"; }
new ResizeObserver(fit).observe(box);

async function build(urlFor){
  stage.innerHTML=""; stage.style.width=""; stage.style.aspectRatio=""; hovered=selected=null; ratio=0; layers=[];
  const loaded=[];
  for(const p of PARTS){ const u=urlFor(p.id); if(!u) continue; try{loaded.push({p,img:await loadImg(u)});}catch(e){} }
  if(!loaded.length){ stage.innerHTML='<div class="msg">No layers found in <b>'+FOLDER+'</b><br>Name the PNGs like <b>left-caudal.png</b>, or load them here:</div>'; $("pickBtn").style.display="inline-block"; return false; }
  W=loaded[0].img.naturalWidth; H=loaded[0].img.naturalHeight; M=W*0.34; ratio=(W+2*M)/H;
  stage.style.aspectRatio=(W+2*M)+"/"+H;
  art=document.createElement("div"); art.className="art";
  art.style.left=(M/(W+2*M)*100)+"%"; art.style.width=(W/(W+2*M)*100)+"%"; stage.appendChild(art);
  const sc=Math.min(1,700/W), cw=Math.round(W*sc), ch=Math.round(H*sc); let tainted=false;
  for(const o of loaded){
    art.appendChild(o.img);
    const c=document.createElement("canvas"); c.width=cw; c.height=ch;
    const ctx=c.getContext("2d",{willReadFrequently:true}); ctx.drawImage(o.img,0,0,cw,ch);
    try{o.data=ctx.getImageData(0,0,cw,ch).data;}catch(e){tainted=true;}
    o.cw=cw;o.ch=ch;o.sc=sc;o.el=o.img;
  }
  const ou=urlFor(OVERLAY_ID);
  if(ou){ try{overlayImg=await loadImg(ou);overlayImg.className="overlay";art.appendChild(overlayImg);$("bOverlay").style.display="";}catch(e){} }
  layers=loaded; if(tainted) $("pickBtn").style.display="inline-block";
  buildLabels(); fit(); return true;
}

function centroid(o){ if(!o.data) return null; let sx=0,sy=0,n=0;
  for(let y=0;y<o.ch;y+=3)for(let x=0;x<o.cw;x+=3) if(o.data[(y*o.cw+x)*4+3]>40){sx+=x;sy+=y;n++;}
  return n?[sx/n/o.sc,sy/n/o.sc]:null; }

function buildLabels(){
  const svg=document.createElementNS(NS,"svg"); svg.setAttribute("class","lab");
  svg.setAttribute("viewBox",`${-M} 0 ${W+2*M} ${H}`); stage.appendChild(svg);
  const fs=W*0.03, gap=fs*2.3, items=[];
  layers.forEach(o=>{const c=centroid(o); if(c) items.push({o,cx:c[0],cy:c[1],side:c[0]<W/2?"L":"R"});});
  ["L","R"].forEach(s=>{ const g=items.filter(i=>i.side===s).sort((a,b)=>a.cy-b.cy); let last=-1e9;
    g.forEach(i=>{i.ly=Math.max(i.cy,last+gap,fs);last=i.ly;}); const over=last-(H-fs); if(over>0) g.forEach(i=>i.ly-=over); });
  items.forEach(i=>{
    const L=i.side==="L", ex=L?-fs*.6:W+fs*.6, tx=L?-fs*1.1:W+fs*1.1, g=document.createElementNS(NS,"g");
    g.setAttribute("class","lbl"); g.id="lbl-"+i.o.p.id;
    g.innerHTML=`<polyline points="${i.cx},${i.cy} ${ex},${i.ly}"/><circle cx="${i.cx}" cy="${i.cy}" r="${fs*.25}"/><text x="${tx}" y="${i.ly+fs*.35}" font-size="${fs}" text-anchor="${L?"end":"start"}">${i.o.p.name}</text>`;
    svg.appendChild(g);
  });
}

function hit(e){
  const r=art.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
  if(x<0||x>1||y<0||y>1) return null;
  for(let k=layers.length-1;k>=0;k--){ const o=layers[k]; if(!o.data) continue;
    if(o.data[(Math.floor(y*o.ch)*o.cw+Math.floor(x*o.cw))*4+3]>40) return o.p.id; }
  return null;
}

function paint(){ layers.forEach(o=>{ const id=o.p.id,e=o.el;
  e.classList.toggle("hover",mode==="explore"&&id===hovered&&id!==selected);
  e.classList.toggle("sel",id===selected); e.classList.toggle("dim",selected!==null&&id!==selected);
  const L=$("lbl-"+id); if(L) L.classList.toggle("show",allLabels||id===selected||(mode==="explore"&&id===hovered)); }); }

function question(){ const ids=layers.map(o=>o.p.id); target=ids[Math.floor(Math.random()*ids.length)];
  infoBody.innerHTML=`<div class="q">Where is the <span>${byId(target).name}</span>?</div><p id="fb">Score: ${score} / ${tries}</p>`; }

function onClick(e){
  if(locked||!art) return; const id=hit(e);
  if(!id){ if(mode==="explore"){selected=null;infoBody.innerHTML=HOME;paint();} return; }
  const p=byId(id);
  if(mode==="explore"){ selected=id; infoBody.innerHTML=`<h2>${p.name}</h2><p>${p.fn}</p>`; paint(); return; }
  tries++;
  if(id===target){ score++; selected=id; locked=true; paint();
    infoBody.innerHTML=`<div class="ok">Correct: ${p.name}</div><p>${p.fn}</p>`;
    setTimeout(()=>{selected=null;locked=false;paint();question();},2200);
  } else $("fb").innerHTML=`<span class="bad">Not quite, that's the ${p.name}. Try again.</span>`;
}
stage.addEventListener("click",onClick);
stage.addEventListener("pointermove",e=>{ if(!art) return; const id=hit(e); stage.style.cursor=id?"pointer":"default"; if(id!==hovered){hovered=id;paint();} });
stage.addEventListener("pointerleave",()=>{hovered=null;paint();});

function setMode(m){ mode=m;selected=null;score=tries=0;locked=false;
  $("bExplore").classList.toggle("on",m==="explore"); $("bQuiz").classList.toggle("on",m==="quiz");
  if(m==="explore") infoBody.innerHTML=HOME; else if(layers.length) question(); paint(); }
$("bExplore").onclick=()=>setMode("explore"); $("bQuiz").onclick=()=>setMode("quiz");
$("bLabels").onclick=e=>{allLabels=!allLabels;e.currentTarget.classList.toggle("on",allLabels);paint();};
$("bOverlay").onclick=e=>{ if(overlayImg) e.currentTarget.classList.toggle("on",overlayImg.classList.toggle("on")); };
$("picker").addEventListener("change",async e=>{
  const map={}; [...e.target.files].forEach(f=>map[f.name.replace(/\.png$/i,"").toLowerCase()]=URL.createObjectURL(f));
  await build(id=>map[id.toLowerCase()]||null); setMode(mode); });

infoBody.innerHTML=HOME;
build(id=>FOLDER+id+".png").then(()=>setMode("explore"));
</script>
</body>
</html>
