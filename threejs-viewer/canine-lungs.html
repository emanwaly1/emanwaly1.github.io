<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canine lungs – interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#22313a;--dim:#5a6b73;--line:#d3e0dc;--card:#fff;--bg:#f1f6f4;--coral:#d9566f;--ok:#2e8b57;
--display:"Bricolage Grotesque",system-ui,sans-serif;--sans:"Karla",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--card);color:var(--ink);font:400 1rem/1.5 var(--sans)}
.app{display:flex;flex-direction:column;height:100%;padding:10px;gap:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar button{font:500 .95rem var(--sans);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 16px;color:var(--ink);cursor:pointer}
.bar button:hover{background:var(--bg)}
.bar button.on{background:var(--coral);border-color:var(--coral);color:#fff}
.box{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:14px;overflow:hidden}
.stage{position:relative}
.art{position:absolute;top:0;height:100%}
.layer{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;transition:filter .15s}
.layer.hover{filter:drop-shadow(0 0 2px var(--coral)) drop-shadow(0 0 5px var(--coral)) brightness(1.1)}
.layer.sel{filter:drop-shadow(0 0 3px var(--coral)) drop-shadow(0 0 7px var(--coral)) saturate(1.5)}
svg.lab{position:absolute;inset:0;width:100%;height:100%}
.lbl{opacity:0;transition:opacity .2s;pointer-events:none}.lbl.show{opacity:1}
.lbl polyline{stroke:var(--ink);stroke-width:1.5px;fill:none;vector-effect:non-scaling-stroke}
.lbl circle{fill:var(--ink)}.lbl text{fill:var(--ink);font-weight:700;font-family:var(--sans)}
.info{flex:none;height:92px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.info h2{font:700 1.15rem var(--display);color:var(--coral);margin-bottom:2px}
.info p{color:var(--dim);font-size:.95rem}
.q{font:700 1.15rem var(--display)}.q span{color:var(--coral)}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--coral);font-weight:700}
.msg{padding:24px;text-align:center;color:var(--dim)}
/* plain mode (?view=plain): just the picture, no controls */
body.plain .bar,body.plain .info{display:none}
body.plain .app{padding:0}
body.plain .box{border-radius:12px}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button id="bExplore" class="on">Explore</button>
    <button id="bQuiz">Quiz</button>
    <button id="bLabels">All labels</button>
  </div>
  <div class="box" id="box"><div class="stage" id="stage"><div class="msg">Loading…</div></div></div>
  <div class="info" id="infoBody"></div>
</div>

<script>
/* ===== EDIT HERE ===== */
// Folder with one transparent picture per part (relative to this file).
// Each file must be named exactly like the "id" below: left-caudal.png, trachea.png, ...
// All pictures must have the SAME canvas size (export every layer at the full canvas size).
const FOLDER = "images/";
const EXTS = ["png","webp"];

// Listed from the bottom layer to the top layer.
const PARTS = [
 {id:"left-caudal",  name:"Left caudal lobe",   fn:"Largest lobe of the left lung, lying over the diaphragm."},
 {id:"left-cranial", name:"Left cranial lobe",  fn:"The left lung has only 2 lobes. This one has a cranial and a caudal part, partly separated."},
 {id:"right-caudal", name:"Right caudal lobe",  fn:"Largest lobe of the right lung, over the diaphragm."},
 {id:"right-middle", name:"Right middle lobe",  fn:"Lies ventrally beside the heart. In aspiration pneumonia the cranioventral lobes, including this one, are typically hit first."},
 {id:"right-cranial",name:"Right cranial lobe", fn:"First of the 4 right lobes: cranial, middle, caudal and accessory."},
 {id:"accessory",    name:"Accessory lobe",     fn:"Small right lobe that wraps around the caudal vena cava, tucked medially."},
 {id:"bronchial-tree",name:"Bronchial tree",    fn:"Principal bronchi, then lobar, segmental bronchi and bronchioles, ending in alveoli where gas exchange happens.", thin:true},
 {id:"trachea",      name:"Trachea",            fn:"Airway reinforced with C-shaped cartilage rings. Divides at the carina into the two principal bronchi.", thin:true}
];
const HOME = "<p>Hover or tap a lobe to see its name. Switch to Quiz to test yourself.</p>";
/* ====================== */

const PLAIN = new URLSearchParams(location.search).get("view")==="plain";
if(PLAIN) document.body.classList.add("plain");

const $=id=>document.getElementById(id), stage=$("stage"), box=$("box"), infoBody=$("infoBody");
const NS="http://www.w3.org/2000/svg", byId=id=>PARTS.find(p=>p.id===id);
let W=0,H=0,M=0,ratio=0,S=1,AW=0,AH=0;
let mode="explore",allLabels=false,selected=null,hovered=null,target=null,score=0,tries=0,locked=false,ids=[];
const alpha={}, anchors={}, layers={};

function fit(){ if(ratio) stage.style.width=Math.min(box.clientWidth,box.clientHeight*ratio)+"px"; }
new ResizeObserver(fit).observe(box);

function loadImg(id){
  return new Promise(res=>{
    let k=0;
    (function next(){
      if(k>=EXTS.length) return res(null);
      const im=new Image(); im.onload=()=>res(im); im.onerror=()=>{k++;next();};
      im.src=FOLDER+id+"."+EXTS[k];
    })();
  });
}

// Alpha map of one picture, at reduced size (fast hit-testing). Returns null if the browser blocks pixel reading.
function makeAlpha(im){
  const c=document.createElement("canvas"); c.width=AW; c.height=AH;
  const g=c.getContext("2d",{willReadFrequently:true}); g.drawImage(im,0,0,AW,AH);
  let d; try{ d=g.getImageData(0,0,AW,AH).data; }catch(e){ return null; }
  const a=new Uint8Array(AW*AH); for(let i=0;i<a.length;i++) a[i]=d[i*4+3];
  return a;
}
// A point inside the part (natural pixel coords): centroid, snapped to the nearest opaque pixel.
function anchorOf(a){
  let n=0,sx=0,sy=0;
  for(let y=0;y<AH;y++) for(let x=0;x<AW;x++) if(a[y*AW+x]>40){n++;sx+=x;sy+=y;}
  if(!n) return null;
  let cx=Math.round(sx/n), cy=Math.round(sy/n);
  if(a[cy*AW+cx]<=40){
    let best=1e18;
    for(let y=0;y<AH;y++) for(let x=0;x<AW;x++) if(a[y*AW+x]>40){ const k=(x-cx)**2+(y-cy)**2; if(k<best){best=k;cx=x;cy=y;} }
  }
  return [cx/S,cy/S];
}

function hitAt(x,y){                       // x,y in natural pixel coords
  const ax=Math.round(x*S), ay=Math.round(y*S);
  if(ax<0||ay<0||ax>=AW||ay>=AH) return null;
  for(let i=ids.length-1;i>=0;i--){ const id=ids[i]; if(alpha[id][ay*AW+ax]>30) return id; }
  // thin parts (bronchi, trachea) are hard to hit exactly: allow a small margin
  const r=Math.max(3,Math.round(AW*0.012));
  for(let i=ids.length-1;i>=0;i--){ const id=ids[i]; if(!byId(id).thin) continue; const a=alpha[id];
    for(let dy=-r;dy<=r;dy++){ const yy=ay+dy; if(yy<0||yy>=AH) continue;
      for(let dx=-r;dx<=r;dx++){ const xx=ax+dx; if(xx<0||xx>=AW) continue; if(a[yy*AW+xx]>30) return id; } } }
  return null;
}

async function build(){
  const loaded=await Promise.all(PARTS.map(p=>loadImg(p.id).then(im=>({p,im}))));
  const ok=loaded.filter(o=>o.im), missing=loaded.filter(o=>!o.im).map(o=>o.p.id);
  if(!ok.length){ stage.innerHTML='<div class="msg">No pictures found in <b>'+FOLDER+'</b><br>Expected files like <b>'+FOLDER+'left-caudal.png</b></div>'; return; }
  W=ok[0].im.naturalWidth; H=ok[0].im.naturalHeight;
  const odd=ok.filter(o=>o.im.naturalWidth!==W||o.im.naturalHeight!==H).map(o=>o.p.id);
  M=W*0.34; ratio=(W+2*M)/H;
  S=Math.min(1,900/W); AW=Math.round(W*S); AH=Math.round(H*S);

  stage.innerHTML=""; stage.style.aspectRatio=(W+2*M)+"/"+H;
  const art=document.createElement("div"); art.className="art";
  art.style.left=(M/(W+2*M)*100)+"%"; art.style.width=(W/(W+2*M)*100)+"%"; stage.appendChild(art);
  ok.forEach(o=>{ o.im.className="layer"; o.im.alt=""; o.im.draggable=false; art.appendChild(o.im); layers[o.p.id]=o.im; });

  if(odd.length||missing.length){
    let t=""; if(missing.length) t+="Missing pictures: "+missing.join(", ")+". ";
    if(odd.length) t+="These pictures have a different size from the others: "+odd.join(", ")+". Export every layer at the same full canvas size.";
    infoBody.innerHTML="<p class='bad'>"+t+"</p>"; if(odd.length) return;
  }
  if(PLAIN) return;

  // alpha maps (needs the page to be served over http/https, not opened as a local file)
  for(const o of ok){ const a=makeAlpha(o.im); if(!a){
      infoBody.innerHTML="<p class='bad'>The browser blocks reading the pictures when the page is opened from a local file. Run it through GitHub Pages or a local server (e.g. VS Code Live Server) and the hover will work.</p>"; return; }
    alpha[o.p.id]=a; }
  ids=ok.map(o=>o.p.id);

  const svg=document.createElementNS(NS,"svg"); svg.setAttribute("class","lab"); svg.setAttribute("viewBox",`${-M} 0 ${W+2*M} ${H}`); stage.appendChild(svg);

  const fs=W*0.03, gap=fs*2.3, items=[];
  ids.forEach(id=>{ const a=anchorOf(alpha[id]); if(a){ anchors[id]=a; items.push({id,cx:a[0],cy:a[1],side:a[0]<W/2?"L":"R"}); } });
  ["L","R"].forEach(s=>{ const g=items.filter(i=>i.side===s).sort((a,b)=>a.cy-b.cy); let last=-1e9;
    g.forEach(i=>{i.ly=Math.max(i.cy,last+gap,fs);last=i.ly;}); const over=last-(H-fs); if(over>0) g.forEach(i=>i.ly-=over); });
  items.forEach(i=>{ const L=i.side==="L", ex=L?-fs*.6:W+fs*.6, tx=L?-fs*1.1:W+fs*1.1, g=document.createElementNS(NS,"g");
    g.setAttribute("class","lbl"); g.id="lbl-"+i.id;
    g.innerHTML=`<polyline points="${i.cx},${i.cy} ${ex},${i.ly}"/><circle cx="${i.cx}" cy="${i.cy}" r="${fs*.25}"/><text x="${tx}" y="${i.ly+fs*.35}" font-size="${fs}" text-anchor="${L?"end":"start"}">${byId(i.id).name}</text>`;
    svg.appendChild(g); });

  const pick=e=>{ const r=svg.getBoundingClientRect();
    return hitAt(((e.clientX-r.left)/r.width*(W+2*M))-M, (e.clientY-r.top)/r.height*H); };
  svg.addEventListener("pointermove",e=>{ const id=pick(e); svg.style.cursor=id?"pointer":"default"; if(id!==hovered){hovered=id;paint();} });
  svg.addEventListener("pointerleave",()=>{hovered=null;paint();});
  svg.addEventListener("click",e=>onClick(pick(e)));
  fit();
}

function paint(){
  Object.keys(layers).forEach(id=>{ const el=layers[id];
    el.classList.toggle("hover",mode==="explore"&&id===hovered&&id!==selected); el.classList.toggle("sel",id===selected); });
  ids.forEach(id=>{ const l=$("lbl-"+id); if(l) l.classList.toggle("show",allLabels||id===selected||(mode==="explore"&&id===hovered)); });
}
function question(){ target=ids[Math.floor(Math.random()*ids.length)];
  infoBody.innerHTML=`<div class="q">Where is the <span>${byId(target).name}</span>?</div><p id="fb">Score: ${score} / ${tries}</p>`; }

function onClick(id){
  if(locked||!ids.length) return;
  if(!id){ if(mode==="explore"){selected=null;infoBody.innerHTML=HOME;paint();} return; }
  const p=byId(id);
  if(mode==="explore"){ selected=id; infoBody.innerHTML=`<h2>${p.name}</h2><p>${p.fn}</p>`; paint(); return; }
  tries++;
  if(id===target){ score++; selected=id; locked=true; paint();
    infoBody.innerHTML=`<div class="ok">Correct: ${p.name}</div><p>${p.fn}</p>`;
    setTimeout(()=>{selected=null;locked=false;paint();question();},2200);
  } else $("fb").innerHTML=`<span class="bad">Not quite, that's the ${p.name}. Try again.</span>`;
}

function setMode(m){ mode=m;selected=null;score=tries=0;locked=false;
  $("bExplore").classList.toggle("on",m==="explore"); $("bQuiz").classList.toggle("on",m==="quiz");
  if(ids.length){ if(m==="explore") infoBody.innerHTML=HOME; else question(); } paint(); }
$("bExplore").onclick=()=>setMode("explore"); $("bQuiz").onclick=()=>setMode("quiz");
$("bLabels").onclick=e=>{allLabels=!allLabels;e.currentTarget.classList.toggle("on",allLabels);paint();};

infoBody.innerHTML=HOME;
build().then(()=>{ if(ids.length) setMode("explore"); });
</script>
</body>
</html>
